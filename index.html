<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>FC26 Companion - Elite Edition</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0">
<link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@400;700&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
:root {
    --bg-dark: #0d0e12;
    --card-bg: #1a1c24;
    --fc-gold: #d4af37;
    --fc-blue: #00e5ff;
    --fc-green: #00ff85;
    --fc-red: #ff4b4b;
    --glass: rgba(255, 255, 255, 0.05);
    --border: rgba(255, 255, 255, 0.1);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body { 
    margin: 0; 
    font-family: 'Poppins', sans-serif; 
    background: var(--bg-dark); 
    background-image: radial-gradient(circle at top right, #1e2129, #0d0e12);
    color: white; 
    padding-bottom: 90px; 
    overflow-x: hidden;
}

/* --- COMPONANT STYLE: CARDS --- */
.fut-card {
    background: linear-gradient(135deg, #2a2e38 0%, #16191f 100%);
    border-radius: 8px;
    border-left: 4px solid var(--fc-gold);
    margin-bottom: 12px;
    padding: 15px;
    display: flex;
    align-items: center;
    box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    position: relative;
}

.rating-badge {
    font-family: 'Roboto Condensed', sans-serif;
    font-size: 1.8rem;
    font-weight: 700;
    color: var(--fc-gold);
    min-width: 50px;
    text-align: center;
    border-right: 1px solid var(--border);
    margin-right: 15px;
}

.player-main { flex: 1; }
.player-name { font-weight: 600; font-size: 1rem; text-transform: uppercase; letter-spacing: 0.5px; }
.player-sub { font-size: 0.7rem; color: #8b949e; }

.mini-stats { display: flex; gap: 10px; margin-top: 5px; }
.mini-stat-item { font-size: 0.65rem; background: var(--glass); padding: 2px 6px; border-radius: 4px; }
.mini-stat-item b { color: var(--fc-blue); }

/* --- HEADER & NAV --- */
header {
    background: rgba(13, 14, 18, 0.95);
    backdrop-filter: blur(10px);
    padding: 15px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    position: sticky;
    top: 0;
    z-index: 1000;
    border-bottom: 1px solid var(--border);
}

.header-title { font-family: 'Roboto Condensed', sans-serif; font-weight: 700; color: var(--fc-gold); font-size: 1.2rem; }

nav {
    position: fixed;
    bottom: 0;
    width: 100%;
    background: #16191f;
    display: flex;
    justify-content: space-around;
    padding: 10px 0;
    border-top: 2px solid var(--fc-gold);
    z-index: 2000;
}

nav button {
    background: none; border: none; color: #666;
    display: flex; flex-direction: column; align-items: center;
    font-size: 0.65rem; gap: 4px; transition: 0.3s;
}

nav button.active { color: var(--fc-gold); transform: translateY(-3px); }
nav button i { font-size: 1.2rem; }

/* --- BUTTONS --- */
.btn-fc {
    background: var(--fc-gold);
    color: #000;
    border: none;
    padding: 12px;
    border-radius: 6px;
    font-weight: 700;
    text-transform: uppercase;
    font-size: 0.8rem;
    cursor: pointer;
    width: 100%;
    transition: 0.2s;
}
.btn-fc:active { transform: scale(0.98); opacity: 0.8; }

/* --- LOGIN & MODALS --- */
#loginOverlay {
    position: fixed; inset: 0; background: var(--bg-dark); z-index: 9999;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
}
.login-btn {
    background: var(--card-bg); border: 1px solid var(--border);
    color: white; padding: 20px; border-radius: 8px; margin: 5px; width: 140px;
    text-align: center; font-weight: 600;
}

/* --- STATS DASHBOARD --- */
.stats-container { padding: 15px; }
.section-title { font-size: 0.8rem; color: var(--fc-gold); font-weight: 700; margin: 20px 0 10px 0; text-transform: uppercase; display: flex; align-items: center; gap: 8px;}

/* --- IA & PREDICTIONS --- */
.ia-card {
    background: linear-gradient(135deg, #001f3f 0%, #000a12 100%);
    border: 1px solid var(--fc-blue);
    padding: 20px; border-radius: 12px; margin-bottom: 20px;
}

/* --- FORM DOTS --- */
.form-dots { display: flex; gap: 4px; margin-top: 8px; }
.dot { width: 8px; height: 8px; border-radius: 50%; }
.win { background: var(--fc-green); box-shadow: 0 0 5px var(--fc-green); }
.loss { background: var(--fc-red); }
.draw { background: #8b949e; }

/* REUTILISATION DES STYLES EXISTANTS POUR LES DES ET MATCHS */
.team-select { background: #000; color: white; border: 1px solid var(--border); border-radius: 4px; padding: 5px; font-size: 0.7rem; }
.score-input { width: 40px; height: 40px; background: #000; border: 1px solid var(--fc-gold); color: white; text-align: center; border-radius: 4px; font-weight: bold; }
.dice-input { width: 35px; height: 35px; border-radius: 50%; border: 2px solid var(--fc-blue); background: #000; color: var(--fc-blue); text-align: center; font-weight: bold; display: none; margin-left: 5px; }

#syncNotify { position: fixed; top: 70px; left: 50%; transform: translateX(-50%); background: var(--fc-gold); color: black; padding: 5px 15px; border-radius: 20px; font-size: 0.7rem; font-weight: bold; z-index: 3000; display: none; }
</style>
</head>
<body>

<div id="syncNotify">SYNC LIVE...</div>

<div id="loginOverlay">
    <div class="header-title" style="font-size: 2.5rem; margin-bottom: 30px;">FC26 COMPANION</div>
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
        <div class="login-btn" onclick="checkPin()" style="border-color: var(--fc-gold);">ADMIN</div>
        <div class="login-btn" onclick="login('BVI')">BVI</div>
        <div class="login-btn" onclick="login('NAD')">NAD</div>
        <div class="login-btn" onclick="login('WIL')">WIL</div>
        <div class="login-btn" onclick="login('BROOK')">BROOK</div>
    </div>
</div>

<div id="pinOverlay" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.9); z-index:10000; flex-direction:column; align-items:center; justify-content:center;">
    <input type="password" id="pinCode" maxlength="4" style="background:#000; border:2px solid var(--fc-gold); color:white; font-size:2rem; text-align:center; width:150px; padding:10px; border-radius:10px; letter-spacing:10px; margin-bottom:20px;">
    <button class="btn-fc" style="width:150px" onclick="validatePin()">ENTRER</button>
</div>

<header>
    <div onclick="logout()"><i class="fas fa-sign-out-alt"></i></div>
    <div class="header-title">FC26 MANAGER</div>
    <div id="seasonBadge" style="background:var(--fc-gold); color:black; padding:2px 8px; border-radius:4px; font-size:0.7rem; font-weight:bold;">S1</div>
</header>

<main id="app" class="stats-container"></main>

<nav>
    <button class="active" data-tab="dashboard"><i class="fas fa-chart-bar"></i><span>ACCUEIL</span></button>
    <button data-tab="matches"><i class="fas fa-gamepad"></i><span>MATCHS</span></button>
    <button data-tab="analysis"><i class="fas fa-brain"></i><span>IA</span></button>
    <button data-tab="hof"><i class="fas fa-crown"></i><span>PANTHEON</span></button>
    <button data-tab="players"><i class="fas fa-users"></i><span>CLUB</span></button>
</nav>

<script>
// --- TOUTE LA LOGIQUE INITIALE EST CONSERVÉE ICI ---
const FB_URL = "https://fc26-e596e-default-rtdb.europe-west1.firebasedatabase.app/data.json";
const ADMIN_PIN = "1234";
const TEAMS = ["Real Madrid", "Man City", "Barcelone", "Bayern Munich", "Liverpool", "PSG", "Arsenal", "Inter Milan", "Milan AC", "Atletico", "Leverkusen", "Dortmund", "Juventus", "Naples", "Chelsea", "Aston Villa"];

let currentUser = localStorage.getItem("fc26_user") || null;
let state = { season: 1, players: [], currentDay: [], archives: [], rotationQueue: [] };
let isInteracting = false;

// Fonctions de données (PULL/PUSH)
async function pushData() { if (currentUser === 'ADMIN') { try { await fetch(FB_URL, { method: 'PUT', body: JSON.stringify(state) }); } catch (e) {} } }
async function pullData() {
    if (isInteracting) return;
    try {
        const res = await fetch(FB_URL);
        const data = await res.json();
        if (data && JSON.stringify(data) !== JSON.stringify(state)) {
            state = data; render(); 
            document.querySelector('#seasonBadge').innerText = `S${state.season}`;
        }
    } catch (e) {}
}

setInterval(pullData, 5000);

// Auth
function checkPin() { document.querySelector('#pinOverlay').style.display = 'flex'; document.querySelector('#pinCode').focus(); }
function validatePin() { if(document.querySelector('#pinCode').value === ADMIN_PIN) { document.querySelector('#pinOverlay').style.display = 'none'; login('ADMIN'); } else { alert("Code erroné"); } }
function login(user) { currentUser = user; localStorage.setItem("fc26_user", user); document.querySelector('#loginOverlay').style.display = 'none'; pullData(); }
function logout() { localStorage.removeItem("fc26_user"); location.reload(); }
if(currentUser) login(currentUser);

// Calculs de stats
function calculateValue(p) { 
    return (10 + ((p.points || 0) * 1.5) + (((p.gf || 0) - (p.ga || 0)) * 0.5) + ((p.cs || 0) * 1.0)).toFixed(1); 
}

function getForm(name) {
    const history = []; const allMatches = state.archives ? state.archives.flat() : [];
    [...allMatches].reverse().forEach(m => {
        if((m.p1 === name || m.p2 === name) && history.length < 5) {
            const win = (m.p1 === name) ? m.s1 > m.s2 : m.s2 > m.s1;
            const draw = m.s1 === m.s2;
            history.push(win ? 'win' : (draw ? 'draw' : 'loss'));
        }
    });
    return history;
}

// --- RENDERING ENGINE (COMPANION STYLE) ---
function render() {
    const tab = document.querySelector("nav button.active").dataset.tab;
    const app = document.querySelector("#app");
    app.innerHTML = "";

    if (tab === "dashboard") {
        const sorted = [...state.players].sort((a,b) => b.points - a.points);
        app.innerHTML = `
            <div class="section-title"><i class="fas fa-trophy"></i> CLASSEMENT SAISON ${state.season}</div>
            ${sorted.map((p, idx) => `
                <div class="fut-card">
                    <div class="rating-badge">${Math.round(calculateValue(p))}</div>
                    <div class="player-main">
                        <div class="player-name">#${idx+1} ${p.name}</div>
                        <div class="mini-stats">
                            <span class="mini-stat-item">PTS <b>${p.points}</b></span>
                            <span class="mini-stat-item">DIFF <b>${p.gf - p.ga}</b></span>
                            <span class="mini-stat-item">CS <b>${p.cs || 0}</b></span>
                        </div>
                        <div class="form-dots">
                            ${getForm(p.name).map(f => `<div class="dot ${f}"></div>`).join('')}
                        </div>
                    </div>
                </div>
            `).join('')}
            
            ${currentUser === 'ADMIN' ? `<button class="btn-fc" style="margin-top:20px; background:#ff4b4b; color:white" onclick="finishSeason()">Terminer la Saison</button>` : ''}
        `;
    }

    if (tab === "matches") {
        if (!state.currentDay || state.currentDay.length === 0) {
            app.innerHTML = `
                <div style="text-align:center; padding-top:50px;">
                    <i class="fas fa-futbol" style="font-size:4rem; color:var(--border); margin-bottom:20px;"></i>
                    <p style="color:var(--muted)">Aucun match en cours</p>
                    ${currentUser === 'ADMIN' ? `
                        <button class="btn-fc" onclick="startDay()">Lancer Journée Classique</button>
                        <button class="btn-fc" style="background:var(--fc-blue); margin-top:10px" onclick="startWinnerStays()">Mode Winner Stays (3J)</button>
                    ` : ''}
                </div>
            `;
        } else {
            app.innerHTML = `
                <div class="section-title"><i class="fas fa-play"></i> MATCHS EN DIRECT</div>
                ${state.currentDay.map((m, i) => `
                    <div class="fut-card" style="display:block; border-left: 2px solid ${m.done ? 'var(--fc-green)' : 'var(--fc-gold)'}">
                        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px">
                            <span style="font-weight:bold">${m.p1}</span>
                            <span style="color:var(--fc-gold)">VS</span>
                            <span style="font-weight:bold">${m.p2}</span>
                        </div>
                        <div style="display:flex; justify-content:center; gap:10px; align-items:center">
                            <input type="number" id="s1_${i}" class="score-input" value="${m.s1??''}" ${m.done || currentUser!=='ADMIN' ?'disabled':''} oninput="toggleDice(${i})">
                            ${state.rotationQueue?.length > 0 ? `<input type="number" id="d1_${i}" class="dice-input" placeholder="🎲">` : ''}
                            <span style="color:var(--border)">-</span>
                            <input type="number" id="s2_${i}" class="score-input" value="${m.s2??''}" ${m.done || currentUser!=='ADMIN' ?'disabled':''} oninput="toggleDice(${i})">
                            ${state.rotationQueue?.length > 0 ? `<input type="number" id="d2_${i}" class="dice-input" placeholder="🎲">` : ''}
                        </div>
                        ${!m.done && currentUser === 'ADMIN' ? `<button class="btn-fc" style="margin-top:10px; height:30px; padding:0" onclick="validateMatch(${i})">VALIDER</button>` : ''}
                    </div>
                `).join('')}
            `;
        }
    }

    if (tab === "analysis") {
        const pred = getLivePrediction();
        app.innerHTML = `
            <div class="section-title">Analyse prédictive</div>
            <div class="ia-card">
                <div style="font-size:0.7rem; color:var(--fc-blue)">PROBABILITÉ DE TITRE</div>
                <div style="font-size:1.8rem; font-weight:bold; margin:10px 0">${pred ? pred.name : '-'}</div>
                <div style="height:8px; background:rgba(255,255,255,0.1); border-radius:4px">
                    <div style="width:${pred?pred.proba:0}%; height:100%; background:var(--fc-blue); border-radius:4px"></div>
                </div>
                <div style="text-align:right; font-size:0.8rem; margin-top:5px">${pred?pred.proba:0}%</div>
            </div>
            <div class="fut-card" style="border-left-color: var(--fc-blue)">
                <div class="player-main">
                    <div class="player-name">Dernier Conseil</div>
                    <div class="player-sub">Focus sur les Clean Sheets pour augmenter votre valeur club.</div>
                </div>
            </div>
        `;
    }

    if (tab === "players") {
        app.innerHTML = `
            <div class="section-title">Gestion des Joueurs</div>
            ${currentUser === 'ADMIN' ? `
                <div class="fut-card" style="border-left-color: var(--fc-green)">
                    <input id="pName" placeholder="Nouveau joueur..." style="background:transparent; border:none; color:white; flex:1">
                    <button class="btn-fc" style="width:50px" onclick="addPlayer()">+</button>
                </div>
            ` : ''}
            ${state.players.map(p => `
                <div class="fut-card" style="border-left:none; background:rgba(255,255,255,0.02)">
                    <div class="player-main">
                        <div class="player-name">${p.name}</div>
                        <div class="player-sub">Valeur: ${calculateValue(p)} M€</div>
                    </div>
                    ${currentUser === 'ADMIN' ? `<i class="fas fa-trash" style="color:var(--fc-red)" onclick="removePlayer('${p.id}')"></i>` : ''}
                </div>
            `).join('')}
        `;
    }

    // On peut ajouter HOF et Archives de la même manière...
}

// Logique de Match (Copie conforme de l'original)
function startDay(){ if(currentUser === 'ADMIN'){ state.currentDay=[]; for(let i=0; i<state.players.length; i++) for(let j=i+1; j<state.players.length; j++) state.currentDay.push({p1:state.players[i].name, p2:state.players[j].name, s1:null, s2:null, done:false, seasonRef:state.season, date:new Date().toLocaleDateString(), team1:"Real", team2:"City"}); pushData(); render(); } }

function startWinnerStays() {
    if(currentUser === 'ADMIN' && state.players.length === 3) {
        const names = state.players.map(p => p.name);
        state.rotationQueue = [names[2]];
        state.currentDay = [{p1: names[0], p2: names[1], s1: null, s2: null, done: false, seasonRef: state.season, date: new Date().toLocaleDateString()}];
        pushData(); render();
    }
}

function validateMatch(i){
    if(currentUser !== 'ADMIN') return;
    const s1=parseInt(document.querySelector(`#s1_${i}`).value), s2=parseInt(document.querySelector(`#s2_${i}`).value);
    if(isNaN(s1)||isNaN(s2)) return;
    
    const m = state.currentDay[i];
    const p1 = state.players.find(p=>p.name===m.p1), p2 = state.players.find(p=>p.name===m.p2);
    
    // Détection dés si rotation et nul
    let diceWinner = null;
    if (state.rotationQueue?.length > 0 && s1 === s2) {
        const d1 = parseInt(document.querySelector(`#d1_${i}`).value);
        const d2 = parseInt(document.querySelector(`#d2_${i}`).value);
        if(isNaN(d1) || isNaN(d2)) { alert("Entrez les dés !"); return; }
        diceWinner = d1 > d2 ? m.p1 : m.p2;
    }

    p1.gf+=s1; p1.ga+=s2; p2.gf+=s2; p2.ga+=s1;
    if(s2 === 0) p1.cs = (p1.cs || 0) + 1;
    if(s1 === 0) p2.cs = (p2.cs || 0) + 1;
    if(s1>s2) p1.points+=3; else if(s2>s1) p2.points+=3; else {p1.points+=1; p2.points+=1;}
    
    m.s1=s1; m.s2=s2; m.done=true;

    // Logique Rotation
    if(state.rotationQueue?.length > 0) {
        const winName = diceWinner || (s1 > s2 ? m.p1 : m.p2);
        const loseName = winName === m.p1 ? m.p2 : m.p1;
        const next = state.rotationQueue.shift();
        state.rotationQueue.push(loseName);
        state.currentDay.push({p1: winName, p2: next, s1: null, s2: null, done: false, seasonRef: state.season});
    }

    if(state.currentDay.every(x=>x.done)){
        if(!state.archives) state.archives=[];
        state.archives.push([...state.currentDay]);
        state.currentDay=[]; state.rotationQueue=[];
    }
    pushData(); render();
}

function getLivePrediction() {
    if(!state.players || state.players.length === 0) return null;
    let scores = state.players.map(p => ({ name: p.name, power: p.points + ((p.gf - p.ga) * 0.5) }));
    scores.sort((a,b) => b.power - a.power);
    let total = scores.reduce((acc, curr) => acc + Math.max(0.1, curr.power), 0);
    return { name: scores[0].name, proba: Math.round((Math.max(0.1, scores[0].power) / total) * 100) };
}

function toggleDice(i) {
    const s1 = document.querySelector(`#s1_${i}`).value;
    const s2 = document.querySelector(`#s2_${i}`).value;
    const d1 = document.querySelector(`#d1_${i}`);
    const d2 = document.querySelector(`#d2_${i}`);
    if(d1 && s1 && s2 && s1 === s2) { d1.style.display = "inline"; d2.style.display = "inline"; }
    else if(d1) { d1.style.display = "none"; d2.style.display = "none"; }
}

function addPlayer(){ if(currentUser==='ADMIN'){ const n=document.querySelector("#pName").value; if(n){state.players.push({id:Date.now().toString(), name:n, points:0, gf:0, ga:0, cs:0}); pushData(); render();}} }
function removePlayer(id){ if(currentUser==='ADMIN' && confirm("Supprimer ?")){ state.players = state.players.filter(p=>p.id!==id); pushData(); render(); }}

function finishSeason(){
    if(currentUser === 'ADMIN' && confirm("Finir la saison et réinitialiser les points ?")){
        if(state.currentDay.length > 0) state.archives.push([...state.currentDay.filter(m=>m.done)]);
        state.season++;
        state.players.forEach(p => { p.points=0; p.gf=0; p.ga=0; p.cs=0; });
        state.currentDay=[];
        pushData(); render();
    }
}

// Navigation
document.querySelectorAll("nav button").forEach(btn => {
    btn.onclick = () => {
        document.querySelectorAll("nav button").forEach(b=>b.classList.remove('active'));
        btn.classList.add('active');
        render();
    };
});

pullData();
</script>
</body>
</html>
